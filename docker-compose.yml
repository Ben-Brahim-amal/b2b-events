version: '3.8'
services:
  php:
    build: ./docker/php
    container_name: b2b_php
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
    networks:
      - b2b_network

  nginx:
    image: nginx:alpine
    container_name: b2b_nginx
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - b2b_network

  db:
    image: mysql:8.0
    container_name: b2b_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: b2b_db
      MYSQL_USER: b2b
      MYSQL_PASSWORD: b2b
    ports:
      - "3308:3306"
    volumes:
      - b2b_db_data:/var/lib/mysql
    networks:
      - b2b_network

volumes:
  b2b_db_data:

networks:
  b2b_network:
    driver: bridge