version: '3.8'
services:
  php:
    build: ./docker/php
    container_name: b2b_php
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
    networks:
      - b2b_network

  nginx:
    image: nginx:alpine
    container_name: b2b_nginx
    ports:
      - "0.0.0.0:8081:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - b2b_network

  db:
    image: mysql:8.0
    container_name: b2b_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: b2b_db
      MYSQL_USER: b2b
      MYSQL_PASSWORD: b2b
    ports:
      - "3308:3306"
    volumes:
      - b2b_db_data:/var/lib/mysql
    networks:
      - b2b_network

  # ← SONARQUBE
  sonarqube:
    image: sonarqube:community
    container_name: b2b_sonarqube
    depends_on:
      - sonar_db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - b2b_network

  # ← BASE DE DONNÉES SONARQUBE (PostgreSQL)
  sonar_db:
    image: postgres:15
    container_name: b2b_sonar_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - b2b_network

volumes:
  b2b_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:

networks:
  b2b_network:
    driver: bridge